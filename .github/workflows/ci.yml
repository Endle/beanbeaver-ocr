name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m py_compile ocr_service.py

      - name: Validate container file exists
        run: test -f Containerfile

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Build container image
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          file: Containerfile
          load: true
          tags: beanbeaver-ocr:ci
          cache-from: |
            type=gha,scope=ocr-image-shared
            type=gha,scope=ocr-image-ci
          cache-to: type=gha,mode=max,scope=ocr-image-ci

      - name: Start OCR service
        run: |
          docker run -d --rm \
            --name beanbeaver-ocr-ci \
            -e BEANBEAVER_OCR_INTERNAL_PORT=8000 \
            -p 8000:8000 \
            beanbeaver-ocr:ci

      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/ocr-health.json; then
              cat /tmp/ocr-health.json
              exit 0
            fi
            sleep 2
          done
          docker logs beanbeaver-ocr-ci
          exit 1

      - name: Stop OCR service
        if: always()
        run: docker rm -f beanbeaver-ocr-ci
